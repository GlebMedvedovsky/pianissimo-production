name: pianissimo-cms
services:
  app:
    build: .
    user: www-data:www-data
    environment:
      COMPOSER_HOME: /var/www/html/storage/composer
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ../contracts:/var/www/contracts:ro
      - ../content:/var/www/content
      - ../frontend/public/media:/var/www/media:ro
      - ../frontend/public/media/cms:/var/www/managed-media
    depends_on:
      db:
        condition: service_healthy
    networks: [cms]
  web:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [cms]
  db:
    image: mariadb:11.8.9
    environment:
      MARIADB_DATABASE: pianissimo
      MARIADB_USER: pianissimo
      MARIADB_PASSWORD: ${DB_PASSWORD:?Generate backend/.env first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate backend/.env first}
    volumes:
      - cms_database:/var/lib/mysql
      - ./docker/init-test.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [cms]
networks:
  cms:
volumes:
  cms_database:
